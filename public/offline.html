<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline · Ruqayya Medical Center Admin</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 32px 24px;
      border-radius: 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(147, 51, 234, 0.2);
      border: 1px solid #9333ea;
      color: #c084fc;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px;
      font-weight: 800;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      background: #9333ea;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }
    .btn:hover {
      background: #7e22ce;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">RMC Admin App</div>
    <h1>You are currently offline</h1>
    <p>Please check your local Wi-Fi or hospital network connection. The Admin portal requires network connectivity to synchronize PostgreSQL live data.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
