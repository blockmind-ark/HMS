services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: hms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hms_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hms}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hms-network

  # -------------------------------------------------------------
  # 2. Next.js Hospital & Pharmacy Application
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hms-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-hms_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-hms}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-hospital-management-system-super-secret-key-2026}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      PORTAL_IP_RESTRICTIONS_ENABLED: ${PORTAL_IP_RESTRICTIONS_ENABLED:-true}
      ALLOWED_IPS_ADMIN: ${ALLOWED_IPS_ADMIN:-127.0.0.1,::1,localhost,192.168.1.26,192.168.1.12,192.168.1.34,192.168.1.0/24,172.18.0.1,172.17.0.1,172.18.0.0/16}
      ALLOWED_IPS_RECEPTIONIST: ${ALLOWED_IPS_RECEPTIONIST:-*}
      ALLOWED_IPS_DOCTOR: ${ALLOWED_IPS_DOCTOR:-*}
      ALLOWED_IPS_PHARMACIST: ${ALLOWED_IPS_PHARMACIST:-*}
      ALLOWED_DOMAINS_ADMIN: ${ALLOWED_DOMAINS_ADMIN:-*}
      ALLOWED_DOMAINS_RECEPTIONIST: ${ALLOWED_DOMAINS_RECEPTIONIST:-*}
      ALLOWED_DOMAINS_DOCTOR: ${ALLOWED_DOMAINS_DOCTOR:-*}
      ALLOWED_DOMAINS_PHARMACIST: ${ALLOWED_DOMAINS_PHARMACIST:-*}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hms-network

# ---------------------------------------------------------------
# Persistent Storage Volumes & Networks
# ---------------------------------------------------------------
volumes:
  postgres_data:
    name: hms_postgres_data

networks:
  hms-network:
    name: hms_network
    driver: bridge
